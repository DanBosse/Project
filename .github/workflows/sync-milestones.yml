name: Sync Milestones to README

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/milestones.md'
      - 'scripts/update_milestones.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Milestone Updater Script
        run: python3 scripts/update_milestones.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README milestone progress [skip ci]"
          file_pattern: 'README.md'
