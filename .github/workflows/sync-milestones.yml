name: Sync Milestones to README

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/milestones.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Calculate and Update README Progress
        run: |
          python3 -c '
          import re
          with open("docs/milestones.md", "r") as f:
              content = f.read()
          total = len(re.findall(r"\| M\d+\s+\|", content))
          completed = len(re.findall(r"\| COMPLETE\s+\|", content))
          pct = int((completed / total) * 100) if total > 0 else 0
          bar = "[" + "█" * int(pct / 2) + "░" * (50 - int(pct / 2)) + "]"
          snippet = f"### Core Platform Readiness\n`{bar}` **{pct}%** ({completed}/{total} Milestones Complete)"
          
          with open("README.md", "r") as f:
              readme = f.read()
          pattern = r"(<!--START_SECTION:milestones-->)(.*?)(<!--END_SECTION:milestones-->)"
          replacement = f"\\1\n{snippet}\n\\3"
          updated = re.sub(pattern, replacement, readme, flags=re.DOTALL) if re.search(pattern, readme, re.DOTALL) else readme + f"\n\n<!--START_SECTION:milestones-->\n{snippet}\n<!--END_SECTION:milestones-->\n"
          with open("README.md", "w") as f:
              f.write(updated)
          print("Updated README successfully!")
          '

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README milestone progress [skip ci]"
          file_pattern: 'README.md'
