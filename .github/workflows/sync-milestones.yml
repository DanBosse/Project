name: Sync Milestones to README

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/milestones.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Calculate and Update README Progress
      run: |
        python3 -c '
        import re

        with open("docs/milestones.md", "r") as f:
            milestones_content = f.read()

        total = len(re.findall(r"\| M\d+\s+\|", milestones_content))
        completed = len(re.findall(r"\| COMPLETE\s+\|", milestones_content))

        percentage = int((completed / total) * 100) if total > 0 else 0

        filled = int(percentage / 2)
        empty = 50 - filled
        bar = "[" + "█" * filled + "░" * empty + "]"
        progress_snippet = f"### Core Platform Readiness\n`{bar}` **{percentage}%** ({completed}/{total} Milestones Complete)"

        with open("README.md", "r") as f:
            readme = f.read()

        pattern = r"(<!--START_SECTION:milestones-->)(.*?)(<!--END_SECTION:milestones-->)"
        replacement = f"\\1\n{progress_snippet}\n\\3"

        if re.search(pattern, readme, re.DOTALL):
            updated_readme = re.sub(pattern, replacement, readme, flags=re.DOTALL)
        else:
            updated_readme = readme + f"\n\n<!--START_SECTION:milestones-->\n{progress_snippet}\n<!--END_SECTION:milestones-->\n"

        with open("README.md", "w") as f:
            f.write(updated_readme)
        print("README successfully synchronized with docs/milestones.md")
        '

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: auto-update README milestone progress [skip ci]"
        file_pattern: 'README.md'
